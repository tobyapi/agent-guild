[package]
name = "runner-client"
version = "0.1.0"
description = "agent-runner sidecar を起動・監視して stdio の JSON Lines で LLM エージェントの実行を依頼するクライアント"
edition = "2021"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

# アプリが落ちても子孫プロセスを残さないためのジョブオブジェクト（KILL_ON_JOB_CLOSE）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
