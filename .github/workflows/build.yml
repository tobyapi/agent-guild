# Windows（x64）と macOS（Apple Silicon）向けのアプリとインストーラーを作る。
# インストーラーには agent-runner と Node.js を同梱し、Claude Code・Codex CLI は利用者の環境のものを使う（docs/design.md §5）。
# 動くのは、Actions の画面からの手動実行（Run workflow）と、v で始まるタグの push のとき。
# できたインストーラーは成果物（Artifacts）に置き、タグのときは下書きのリリースにも添付する。
# 署名はしない（macOS はアドホック署名のみ）ので、初回の起動で OS の警告が出る。

name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            installers: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-arm64
            # macos-latest は Apple Silicon（arm64）
            os: macos-latest
            bundles: app,dmg
            installers: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # 画面のビルド → agent-runner をまとめる（scripts/stage-runner.mjs）→ アプリとインストーラー
      - name: Build the app and the installer
        run: npm run bundle -- --bundles ${{ matrix.bundles }}

      - name: Check the signed macOS bundle without Node.js on PATH
        if: runner.os == 'macOS'
        run: node scripts/check-macos-bundle.mjs src-tauri/target/release/bundle/macos/agent-guild.app

      # 製品名（AIギルド）がファイル名に入るので、配りやすい英数字の名前にそろえる
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          for file in ${{ matrix.installers }}; do
            cp "$file" "out/agent-guild_${{ matrix.name }}_$(basename "$file" | sed 's/^[^_]*_//')"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: agent-guild-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
